<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAJR AI PRO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #111827;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f2937;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 1px;
        }
        .status {
            font-size: 14px;
            color: #10b981;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 14px 18px;
            border-radius: 12px;
            max-width: 80%;
            line-height: 1.6;
            font-size: 15px;
        }
        .ai-message {
            background-color: #1f2937;
            color: #f3f4f6;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
            border: 1px solid #374151;
        }
        .user-message {
            background-color: #0284c7;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            background: #111827;
            padding: 15px 20px;
            border-top: 1px solid #1f2937;
            display: flex;
            justify-content: center;
        }
        .input-wrapper {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            background-color: #38bdf8;
            color: #0b0f19;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">HAJR AI PRO</div>
        <div class="status">
            <span class="status-dot"></span> متصل وجاهز للعمل
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            مرحباً بك يا أمجد. أنا نظام **HAJR AI PRO** الذكي، جاهز لتنفيذ مهامك وإدارتها بكفاءة عالية. كيف يمكنني مساعدتك اليوم؟
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="اكتب رسالتك أو أمرك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');
            const text = inputField.value.trim();

            if (text === "") return;

            // إضافة رسالة المستخدم
            const userMsg = document.createElement('div');
            userMsg.className = 'message user-message';
            userMsg.textContent = text;
            chatContainer.appendChild(userMsg);

            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // محاكاة رد الذكاء الاصطناعي
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai-message';
                aiMsg.textContent = "تم استلام طلبك بنجاح وجاري معالجته عبر منظومة HAJR AI PRO.";
                chatContainer.appendChild(aiMsg);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
