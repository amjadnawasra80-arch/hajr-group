<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAJR Group LTD</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: #0f172a;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 28px;
        }
        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
            box-sizing: border-box;
        }
        .btn:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HAJR Group LTD</h1>
        <p>مرحباً بكم في البوابة الرسمية لمجموعة حجر الدولية. نقدم خدماتنا ومعايير أعمالنا بأعلى مستويات الجودة والاحترافية.</p>
        <a href="https://instagram.com" class="btn">تواصل معنا عبر إنستغرام</a>
    </div>
</body>
</html>
